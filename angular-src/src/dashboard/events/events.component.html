<div class="container dashboard-page eventsView">
    <div class="section-title">
        <p>Wydarzenia</p>
        <div class="title-meta-row title-meta-row--actions-only">
            <div class="actions-inline" aria-label="Akcje i filtry wydarzeń">
                <mat-form-field appearance="outline" subscriptSizing="dynamic">
                    <mat-label>Nazwa</mat-label>
                    <input matInput (keyup)="applyNameFilter($event)" placeholder="Wpisz">
                </mat-form-field>
                <mat-form-field appearance="outline" subscriptSizing="dynamic">
                    <mat-label>Typ</mat-label>
                    <mat-select placeholder="Wybierz" multiple (selectionChange)="applyTypeFilter($event)">
                        <mat-option *ngFor="let type of eventTypes" [value]="type">{{ type }}</mat-option>
                    </mat-select>
                </mat-form-field>
                <button mat-flat-button color="primary" (click)="newEvent()">Nowe wydarzenie</button>
            </div>
        </div>
    </div>

    <mat-card class="event-card page-card">
        <mat-card-content>
            <div class="data-loading-shell" [class.is-loading]="loading">
            <table mat-table [dataSource]="dataSource" matSort class="table">
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Id </th>
                    <td mat-cell *matCellDef="let event" class="align-center">
                        <button mat-button (click)="goToEventSummary(event.id)">{{ event.id }}</button>
                    </td>
                </ng-container>
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Nazwa </th>
                    <td mat-cell *matCellDef="let event">
                        <button mat-button (click)="goToEventSummary(event.id)">{{ event.name }}</button>
                    </td>
                </ng-container>
                <ng-container matColumnDef="date">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Data </th>
                    <td mat-cell *matCellDef="let event"> {{ event.date | date:'dd.MM.yyyy' }} </td>
                </ng-container>
                <ng-container matColumnDef="saldo">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Saldo </th>
                    <td mat-cell *matCellDef="let event" class="align-right" [ngClass]="{'negative': event.saldo < 0}"> {{
                        event.saldo | currency:'PLN' }} </td>
                </ng-container>
                <ng-container matColumnDef="contracts_amount">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Liczba umów </th>
                    <td mat-cell *matCellDef="let event" class="align-center"> {{ event.contracts_amount }} </td>
                </ng-container>
                <ng-container matColumnDef="type">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Typ </th>
                    <td mat-cell *matCellDef="let event"> {{ event.type.value }} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                <tr class="mat-row" *matNoDataRow [style.display]="loading ? 'none' : ''">
                    <td class="mat-cell" colspan="4">Nie znaleziono wydarzeń spełniających zadane kryteria filtrowania</td>
                </tr>
            </table>
            <mat-paginator [pageSizeOptions]="[20, 50, 100]" showFirstLastButtons aria-label="Select page">
            </mat-paginator>
            <div class="data-loading-shell__overlay" *ngIf="loading">
                <mat-spinner diameter="34"></mat-spinner>
            </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
